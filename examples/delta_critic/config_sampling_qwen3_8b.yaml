# Effective sampling settings from value_model/delta_value_llm_exp/
# config_qwen3_8b_densecritic_aligned_sweeps.yaml (2026-09-25).
seed: 42
model:
  actor_model: Qwen/Qwen3-8B
  trust_remote_code: true
  dtype: bfloat16
  max_model_len: 4096
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  gpu_memory_utilization: 0.9
data:
  train_hf_dataset:
    repo_id: zwhe99/DeepMath-103K
    split: train
  test_hf_dataset:
    repo_id: HuggingFaceH4/MATH-500
    split: test
  rank_eval_hf_dataset:
    repo_id: zwhe99/DeepMath-103K
    split: train
prompt:
  template: null
  apply_template_to_existing_prompt: false
reward:
  method: math_verify
  fallback_on_import_error: false
smoke:
  train_prompts: 2048
  test_prompts: 100
  rank_eval_prompts: 100
  rank_eval_prompt_offset: 2048
  responses_per_prompt: 1
  states_per_response: 64
  top_mass: 0.8
rollout:
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.95
  repetition_penalty: 1.05
  stop:
    - "\n\n---\n\n"
  include_stop_str_in_output: false
  top_k_logprobs: 20
state_selection:
  entropy_weight: 0.0
  low_top1_weight: 1.0
  final_window_weight: 0.0
  final_window_tokens: 64
  min_token_gap: 32
  max_candidates: 5
mc:
  continuations_per_state: 32
  save_individual_rewards: true
  save_continuations: true
  max_continuation_tokens: 2048
  temperature: 0.7
  top_p: 0.95
