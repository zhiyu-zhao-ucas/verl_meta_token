# The source's hybrid run (`delta_resp_bal_hybrid_terminal_comp`) also used
# nonzero_balanced_mse, so this stays consistent with the default recipe.
#
# Effective global batch and update budget are REQUIRED CLI arguments.
model_path: Qwen/Qwen3-8B
dtype: bfloat16
attention_implementation: sdpa
value_layer: -1
objective: hybrid_terminal_composition
loss_type: nonzero_balanced_mse
loss_mask: response
delta_label_mode: selected_segment
target_normalization: standardize
# Null resolves to Qwen3-8B's native max_position_embeddings (40960).
max_length: null
window_policy: full
gradient_checkpointing: true
learning_rate: 1.0e-5
weight_decay: 0.0
gradient_clip: 1.0
seed: 42
td_weight: 1.0
terminal_weight: 1.0
continuation_state_count: 64
continuation_min_gap: 32
continuation_budget: null
