# Default delta-critic recipe. `nonzero_balanced_mse` is what every source delta
# critic used, including the verified June/July reference run
# (seed_42_delta_resp_bal: loss_type=nonzero_balanced_mse, balance_active=True).
# Plain `mse` corresponds to the source's separate `delta_resp_mse` method and
# lives in config_train_qwen3_8b_mse.yaml for comparison only.
#
# Effective global batch and update budget are REQUIRED CLI arguments.
model_path: Qwen/Qwen3-8B
dtype: bfloat16
attention_implementation: sdpa
value_layer: -1
objective: local_td0
loss_type: nonzero_balanced_mse
loss_mask: response
delta_label_mode: selected_segment
target_normalization: standardize
# Null resolves to Qwen3-8B's native max_position_embeddings (40960).
max_length: null
window_policy: full
gradient_checkpointing: true
learning_rate: 1.0e-5
weight_decay: 0.0
gradient_clip: 1.0
seed: 42
