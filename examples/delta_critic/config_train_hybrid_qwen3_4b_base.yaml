# Full-context hybrid recipe for the original 4B offline collection.
# Initialize from its TD artifact with the same TD labels/split/normalization.
# Legacy continuations need collection-actor probabilities added by
# examples.delta_critic.rescore_continuations before uncertainty selection.
model_path: Qwen/Qwen3-4B-Base
dtype: bfloat16
attention_implementation: sdpa
value_layer: -1
objective: hybrid_terminal_composition
loss_type: nonzero_balanced_mse
loss_mask: response
delta_label_mode: selected_segment
target_normalization: standardize
max_length: null
window_policy: full
gradient_checkpointing: true
learning_rate: 1.0e-5
weight_decay: 0.0
gradient_clip: 1.0
seed: 42
td_weight: 1.0
terminal_weight: 0.003
terminal_normalization: td
terminal_length_weighting: inverse_count
hybrid_reduction: separate_samples
continuation_selection: uncertainty
continuation_max_candidates: 5
continuation_state_count: 64
continuation_min_gap: 32
# Use every stored MC branch; update budget remains an explicit CLI choice.
continuation_budget: null
